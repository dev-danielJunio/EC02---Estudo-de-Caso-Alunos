<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="container">
        <h3>Relatórios</h3>
        <button type="button" class="btn btn-primary mb-3" id="atualizar-relatorios">Atualizar relatórios</button>

        <h4>Média salarial</h4>
        <p id="media-salarial"></p>

        <h4>Funcionários com salário acima de R$ 5.000,00</h4>
        <table class="table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Cargo</th>
                    <th>Salário</th>
                </tr>
            </thead>
            <tbody id="salarios-altos-lista"></tbody>
        </table>

        <h4>Cargos únicos</h4>
        <ul id="cargos-lista"></ul>

        <h4>Nomes em maiúsculo</h4>
        <ul id="nomes-lista"></ul>
    </main>

    <script>
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            });
    </script>
    <script type="module" src="../controllers/relatorioController.js"></script>
</body>
</html>
